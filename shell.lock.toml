# Lock screen password field: a translucent card with HUD side rails.
# Thin top and bottom edges, thick left and right rails; the rails light up while typing.
background       = "#03060c"
background-alpha = 0.72
text             = "#f1e2cf"
placeholder      = "#867f77"
text-error       = "#ff5a4e"
border           = "#744b23"
border-active    = "#ffa040"
border-error     = "#ff5a4e"
border-alpha     = 1.0
border-width     = "1 3"
selection        = "#ffa040"
selection-alpha  = 0.4
